info:
  app:
    name: '@info.app.name@'
    version: '@info.app.version@'
    grailsVersion: '@info.app.grailsVersion@'
grails:
  mime:
    types:
      all: '*/*'
      atom: application/atom+xml
      css: text/css
      csv: text/csv
      form: application/x-www-form-urlencoded
      html:
      - text/html
      - application/xhtml+xml
      js: text/javascript
      json:
      - application/json
      - text/json
      multipartForm: multipart/form-data
      pdf: application/pdf
      rss: application/rss+xml
      text: text/plain
      hal:
      - application/hal+json
      - application/hal+xml
      xml:
      - text/xml
      - application/xml
  views:
    gsp:
      encoding: UTF-8
      htmlcodec: xml
      codecs:
        scriptlet: html
  codegen:
    defaultPackage: code2
  profile: web
  controllers:
    upload:
      maxFileSize: 30000000
      maxRequestSize: 30000000

  # ============ SPRING MULTIPART ============
  spring:
    servlet:
      multipart:
        enabled: true
        max-file-size: 10MB
        max-request-size: 20MB
        file-size-threshold: 2MB

  # ============ TOMCAT (CLAVE) ============
  server:
    tomcat:
      max-http-form-post-size: 20MB
      max-swallow-size: 20MB

dataSource:
  pooled: true
  jmxExport: true
  driverClassName: org.postgresql.Driver
  username: postgres
  password: 'postgres'
environments:
  development:
    dataSource:
      dbCreate: update
      url: jdbc:postgresql://127.0.0.1:5432/code
      username: postgres
      password: 'postgres'
  test:
    dataSource:
      dbCreate: update
      url: jdbc:postgresql://192.168.100.9:5432/code
  production:
    dataSource:
      dbCreate: none
      url: jdbc:postgresql://127.0.0.1:5432/code
      username: postgres
      password: 'steinsgate'
      properties:
        jmxEnabled: true
        initialSize: 5
        maxActive: 5
        minIdle: 5
        maxIdle: 5
        maxWait: 10000
        maxAge: 600000
        timeBetweenEvictionRunsMillis: 5000
        minEvictableIdleTimeMillis: 60000
        validationQuery: SELECT 1
        validationQueryTimeout: 3
        validationInterval: 15000
        testOnBorrow: true
        testWhileIdle: true
        testOnReturn: false
        jdbcInterceptors: ConnectionState
        defaultTransactionIsolation: 2 # TRANSACTION_READ_COMMITTED

hibernate:
  cache:
    queries: false
    use_second_level_cache: false
    use_query_cache: false

